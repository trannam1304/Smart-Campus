spring:
  application:
    name: smart-campus-backend

  profiles:
    active: mysql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8088

# Cấu hình JWT (FR-1.2, FR-1.3, NFR-03)
app:
  jwt:
    secret: c21hcnQtY2FtcHVzLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI2
    access-token-expiration-ms: 900000        # 15 phút (Access Token ngắn hạn)
    refresh-token-expiration-ms: 604800000    # 7 ngày (Refresh Token dài hạn)
    expiration-ms: 900000

  booking:
    weekly-quota-hours: 10     # FR-3.3
    auto-release-minutes: 15   # FR-5.3
    checkin-early-limit-minutes: 15   # FR-5.2

logging:
  level:
    com.smartcampus.backend: DEBUG
